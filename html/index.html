<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Feather Force Badminton Club</title>

    <!-- CSS Filer -->
     <link rel="stylesheet" href ="../css/main.css">
     <link rel="stylesheet" href ="../css/index.css">
</head>

<body>

    <!-- Sidhuvud med logotyp och navigation -->
    <header class ="site-header">

        <!-- Container för sidhuvudets layout och innehåll -->
        <div clss ="header-container">

            <!-- Logotyp med länk till startsidan -->
            <a href="index.html" class ="logo">

                <!-- Feather Force-klubbens logotyp -->
                <img src ="../images/Feather-Force-logo.png"
                 alt ="Feather Force Badminton Club logo">
            </a>

            <!-- Hamburgermeny med tillgänglighetsanpassade attribut -->
            <button class = "menu-toggle"
                type ="button"  
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="primary-navigation">

                <!-- Hamburgermenyns tre streck -->
                <span class ="bar1"></span>     
                <span class = "bar2"></span>    
                <span class = "bar3"></span>    
            </button>

            <!-- Huvudnavigation för webbplatsens sidor -->
            <nav class="navbar" id="primary-navigation" aria-label="Main navigation">

                <!-- Lista med navigationslänkar -->
                <ul class="nav-list">
      
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="contact.html">Contact</a></li>

                    <!-- Länk till kontaktsidan för medlemskap -->
                    <li><a href="contact.html" class="join-button">Join Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Sidans huvudsakliga innehåll -->
    <main class ="home-page" id="home">

        <!--  Hero-Sektion -->
        <section class ="home-hero">

            <!-- Layout och innehållsbredd för Hero-sektionen -->
            <div class ="hero-layout content-container">

                <!--  Textinnehåll i Hero-Sektionen -->
                <div class ="hero-content">

                    <!-- Tag -->
                     <p class ="hero.tag">PLAY · CONNECT · GROW</p>
                     
                     <!--  Rubrik -->
                    <h1>Find your rhythm on court</h1>

                    <!-- Introduktion-->
                     <p> Ready to get on court? Discover the joy of badminton, challenge yourself, 
                     and make every game count with Feather Force. 
                    </p>

                    <!-- Container för knappar för medlemskap och evenemang -->
                    <div class="hero-actions">

                        <!-- Primär knapp för medlemskap -->
                        <a href ="contacts.html" class ="button button-primary">Become a member &rarr;</a>

                        <!-- Sekundär knapp för evenemang -->
                        <a href="events.html" class ="button button-secondary">Explore events &rarr;</a>
                    </div>

                    <!-- Hero bild -->
                     <img src = "../images/hero-image.png" alt = "Feather Force team">
                </div>

            </div>

            

        </section>

        

    </main>

     <!-- Sidfot med länkar och kontaktinformation -->
    <footer class ="site-footer">

    </footer>
